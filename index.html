ayurveda:{n:'Ayurveda & Medicine',i:'A traditional Indian system of health, documented in classical texts such as the Charaka Samhita (medicine) and Sushruta Samhita (surgery).',s:[['Foundations','Classical texts describe health through three functional principles (dosha: vata, pitta, kapha), digestion, diet and daily routine. These are traditional frameworks, not modern physiological categories.'],['Medicinal plants','Plants such as turmeric, ashwagandha, neem and tulsi are central to the tradition. Modern labs study compounds in them. Sarpagandha (Rauwolfia serpentina) is a documented case: reserpine was isolated from it and used in 20th-century medicine.'],['Practices','Diet guidance, herbal formulations, massage, yoga and seasonal routines. Surgical knowledge in the Sushruta Samhita is a notable historical record.']],e:'Evidence note: traditional claims are not proven treatments. For most Ayurvedic remedies, clinical evidence is limited or mixed. Consult a qualified doctor for any medical decision.'},

<svg id="gr" viewBox="0 0 680 400" width="100%" role="img" aria-label="Knowledge graph"></svg><div class="chips">${Object.entries({ayurveda:'te',agriculture:'fo',sanskrit:'pu',architecture:'or',ai:'go'}).map(([k,c])=>`<span><span style="color:var(--${c})">●</span> ${k==='ai'?'AI & data':DOM[k].n}</span>`).join('')}</div><div class="card" id="nd"><b>Select a node.</b></div>`,
studio:()=>`<h1>AI Research Studio</h1>${aiNote}<div class="chips" id="tl">${TOOLS.map((t,i)=>`<button class="chip${i?'':' on'}" data-i="${i}">${t.n}</button>`).join('')}</div><div class="card" id="tf"></div><div id="tr"></div>`,
assistant:()=>`<h1>ANVAYA AI Assistant</h1><p class="note">General-purpose, not limited to IKS. English, Hindi and Hinglish. Live web search is <b>not configured</b> in this version, so answers come from model knowledge only and may be outdated. Equations appear as plain text.</p>
<div class="chat"><aside><button class="btn" id="nc" style="width:100%">New chat</button><label for="hs">Search chats</label><input id="hs"><div id="hist"></div></aside><div><label for="md">Mode</label><select id="md">${Object.entries(MODES).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><div id="msgs" aria-live="polite"></div><div id="sg" class="chips"></div><textarea id="in" rows="2" placeholder="Ask anything…"></textarea><p><button class="btn" id="sd">Send</button> <button class="btn s" id="st" hidden>Stop</button> <button class="btn s" id="rg">Regenerate</button></p></div></div>`,
library:()=>`<h1>Research Library</h1><p class="note">Entries name real texts, sites and concepts. Summaries are brief descriptions. No URLs or paper citations are included here; find editions and papers through libraries and journals.</p><input id="ls" placeholder="Search texts, concepts, domains…" aria-label="Search"><div class="grid" id="ll" style="margin-top:1rem"></div>`,

about:()=>`<h1>About the Project</h1><p><b>What it is.</b> ANVAYA AI is an interdisciplinary student platform linking Indian Knowledge Systems, modern science and AI.</p><p><b>Why IKS matters.</b> Traditional knowledge holds long-observed practices in medicine, farming, language and building that modern researchers can study with rigorous methods.</p><p><b>The problem.</b> This knowledge is scattered across texts and disciplines, and claims often get mixed with evidence. The platform separates the two and helps users connect domains.</p><p><b>Approach and applications.</b> A connection graph, AI research tools, an assistant, evidence ladders, quizzes and illustrated domain pages support learning and cross-domain exploration.</p><p><b>Vision.</b> A trustworthy, open space for evidence-aware exploration of heritage knowledge.</p><p class="note">This is an academic project. It has no official endorsement, faculty supervision or partnership claims.</p>`,
refs:()=>`<h1>Research & References</h1><p class="note">Primary sources are listed by title only. Edition, translator and publisher details are left for you to verify in a library catalogue; none are invented here. The Library entries and domain pages draw on these.</p><div class="grid">${LIB.map(l=>`<div class="card"><b>${l[0]}</b><br><span class="tag">${l[1]}</span></div>`).join('')}</div><p>For heritage-site claims, see UNESCO World Heritage listings for Rani ki Vav (2014) and Dholavira (2021).</p>`};
for(const k of Object.keys(DOM))P[k]=()=>{const d=DOM[k];return `<div class="ban cover" data-wp="${WPB[k]}">${art(k)}<h1>${d.n}</h1></div><p class="lede">${d.i}</p><p class="note">${d.e}</p><h2>Quick facts</h2><div class="grid">${KF[k].map(f=>`<div class="card fact" style="--c:${COL[k]}"><div class="em">${f[0]}</div><p>${f[1]}</p></div>`).join('')}</div><section id="galsec"><h2>Photo gallery</h2><div class="grid">${WPG[k].map(t=>`<figure class="card gl" data-wp="${t}"></figure>`).join('')}</div><p class="note">Photos load live from Wikipedia and Wikimedia Commons (each has its own free licence; open the source link for credit). Offline, the illustrations show instead.</p></section>${dia(k)}${d.s.map(x=>`<section><h2>${x[0]}</h2><p>${x[1]}</p></section>`).join('')}${tlHTML(k)}${glHTML(k)}<section><h2>Quick quiz: ${d.n}</h2><div id="qz"></div></section>${labHTML(k)}<p><a class="btn" href="#engine">See connections</a> <a class="btn s" href="#iks">More domains</a></p>`};
/* AI helpers */
async function ai(input,opt){opt=opt||{};const ls=f=>{try{return f()}catch(e){return null}};
const model=ls(()=>localStorage.getItem('anv_model'))||'gemini-3.8-flash';const msgs=typeof input==='string'?[{role:'user',content:input}]:input;
const contents=msgs.map(x=>({role:x.role==='assistant'?'model':'user',parts:[{text:x.content}]}));const body=JSON.stringify({model,contents,generationConfig:{maxOutputTokens:2000}});let res=null;
/* 1) Server mode: key lives in .env (local) or hosting env vars; nobody is asked for a key */
try{const r=await fetch('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body,signal:opt.signal});if(r.status!==404&&r.status!==405&&r.headers.get('x-no-key')!=='1')res=r}catch(e){if(e.name==='AbortError')throw e}
/* 2) Fallback: no server (file opened directly) or no key in .env -> ask once, keep in this browser */
if(!res){let k=ls(()=>localStorage.getItem('anv_key'))||'';
if(!k){k=(prompt('Paste your Gemini API key (kept only in this browser). Free key: aistudio.google.com/apikey')||'').trim();if(!k)throw{message:'No API key set. Put GEMINI_API_KEY in the .env file (run node server.js) or get a free key at aistudio.google.com/apikey.'};ls(()=>localStorage.setItem('anv_key',k))}
try{res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify({contents,generationConfig:{maxOutputTokens:2000}}),signal:opt.signal})}catch(e){if(e.name==='AbortError')throw e;throw{message:'Could not reach Google. Check your connection.'}}}
let d={};try{d=await res.json()}catch(e){}
if(!res.ok){const msg=(d.error&&d.error.message)||'Request failed ('+res.status+').';if(/API key/i.test(msg))ls(()=>localStorage.removeItem('anv_key'));throw{message:res.status===429?'Rate limit reached. Wait a minute and try again.':msg}}
const p=(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[];const text=p.map(x=>x.text||'').join('');if(!text)throw{message:'The model returned no answer (it may have been blocked). Try rephrasing.'};
if(opt.onText)opt.onText({text});return{text}}
const TOOLS=[
{n:'Research questions',f:[['topic','Topic','e.g. stepwells and urban water']],p:v=>`Generate 6 focused, answerable research questions on the topic below that link Indian Knowledge Systems with modern science. For each add a one-line method. Mark traditional claims vs evidence clearly. Topic: ${v.topic}`},
{n:'Project ideas',f:[['topic','Interest area','e.g. Sanskrit and NLP'],['level','Level','e.g. undergraduate']],p:v=>`Suggest 4 realistic IKS + AI project ideas for a ${v.level||'student'} on: ${v.topic}. Give goal, data needed, method, risk. Do not invent datasets or papers.`},
{n:'Sanskrit explorer',f:[['text','Sanskrit text (Devanagari or romanised)','e.g. dharmakṣetre kurukṣetre']],p:v=>`Explain this Sanskrit text: transliteration, word-by-word meaning, grammatical notes, and a translation. State uncertainty where it exists. Text: ${v.text}`},
{n:'Traditional vs modern',f:[['trad','Traditional practice or idea',''],['mod','Modern counterpart (optional)','']],p:v=>`Compare the traditional idea with modern science in a table, then separate (a) traditional claims, (b) established evidence, (c) open questions. Never present untested traditional remedies as proven. Traditional: ${v.trad}. Modern: ${v.mod||'choose the closest'}`},
{n:'Methodology',f:[['q','Research question','']],p:v=>`Propose a research methodology for this question: design, data sources, analysis, ethics, limitations. Question: ${v.q}`},
{n:'Concept explorer',f:[['c','Concept or text','e.g. Sulba Sutras']],p:v=>`Give a historical overview of this concept: origins, period (with uncertainty), key texts, scholarly debates and modern relevance. Do not invent citations. Concept: ${v.c}`}];
function studio(){let cur=0;const draw=()=>{const t=TOOLS[cur];$('#tf').innerHTML=t.f.map(f=>`<label for="f_${f[0]}">${f[1]}</label><input id="f_${f[0]}" placeholder="${f[2]}">`).join('')+'<p><button class="btn" id="go">Generate</button></p>';$('#tr').innerHTML='';$('#go').onclick=async()=>{const v={};t.f.forEach(f=>v[f[0]]=$('#f_'+f[0]).value.trim());if((v[t.f[0][0]]||'').length<3){$('#tr').innerHTML='<p class="err">Enter at least 3 characters in the first field.</p>';return}$('#go').disabled=true;$('#tr').innerHTML='<p>Working…</p>';try{const r=await ai('You are a careful academic research assistant for Indian Knowledge Systems. Be accurate; never fabricate references.\n\n'+t.p(v),{cache:false,onText:x=>{$('#tr').innerHTML='<div class="card res">'+esc(x.text)+'</div>'}});$('#tr').innerHTML='<div class="card res" id="out">'+esc(r.text)+'</div><p><button class="btn s" id="cpy">Copy</button> <span class="tag">AI-generated</span></p>';$('#cpy').onclick=()=>navigator.clipboard.writeText(r.text).then(()=>$('#cpy').textContent='Copied',()=>$('#cpy').textContent='Copy failed')}catch(e){$('#tr').innerHTML='<p class="err">'+esc(e.message||e.code||'Request failed')+'. Try again.</p>'}$('#go').disabled=false}};
$('#tl').onclick=e=>{const b=e.target.closest('button');if(!b)return;cur=+b.dataset.i;document.querySelectorAll('#tl .chip').forEach(c=>c.classList.toggle('on',c===b));draw()};draw()}
/* Graph */
function graph(){const svg=$('#gr');let pw='',sel=null;const N=Object.fromEntries(GN.map(n=>[n[0],n]));const cv=d=>d==='ai'?'var(--go)':COL[d];
const draw=()=>{svg.innerHTML=GE.map(e=>{const a=N[e[0]],b=N[e[1]],on=!pw||e[2]===pw;return `<line class="edge" x1="${a[3]}" y1="${a[4]}" x2="${b[3]}" y2="${b[4]}" stroke="var(--go)" stroke-width="${on?2:1}" opacity="${on?.9:.15}"/>`}).join('')+GN.map(n=>{const on=!pw||GE.some(e=>e[2]===pw&&(e[0]===n[0]||e[1]===n[0]));return `<g class="node" tabindex="0" role="button" aria-label="${n[1]}" data-id="${n[0]}" opacity="${on?1:.25}"><circle cx="${n[3]}" cy="${n[4]}" r="${sel===n[0]?26:22}" fill="${cv(n[2])}" stroke="var(--bg)" stroke-width="3"/><text x="${n[3]}" y="${n[4]+40}" text-anchor="middle">${n[1]}</text></g>`}).join('')};
const pick=id=>{sel=id;const n=N[id],rel=GE.filter(e=>e[0]===id||e[1]===id).map(e=>N[e[0]===id?e[1]:e[0]][1]+' ('+PW[e[2]]+')');$('#nd').innerHTML=`<h3>${n[1]}</h3><p>${n[5]}</p><p><b>Linked to:</b> ${rel.join(', ')}</p><p><b>Research question:</b> ${n[6]}</p><button class="btn s" id="ex">Explain with AI</button><h3 style="margin-top:1rem">Bridge hypothesis</h3><label for="bs">Connect with</label><select id="bs">${GN.filter(x=>x[0]!==id).map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select><p><button class="btn" id="br">Generate testable hypothesis</button></p><div id="exo"></div>`;$('#br').onclick=async()=>{const o=N[$('#bs').value];$('#exo').innerHTML='<p>Working…</p>';try{const r=await ai(`Propose ONE testable research hypothesis linking "${n[1]}" and "${o[1]}" (traditional Indian knowledge plus a modern method). Give: hypothesis, variables, data source type, method, how it could be falsified, main limitation. No invented citations or datasets.`,{cache:false});$('#exo').innerHTML='<p class="res">'+esc(r.text)+'</p><span class="tag">AI-generated</span>'}catch(e){$('#exo').innerHTML='<p class="err">'+esc(e.message||'Request failed')+'</p>'}};$('#ex').onclick=async()=>{$('#exo').innerHTML='<p>Working…</p>';try{const r=await ai(`In under 150 words, explain how "${n[1]}" connects traditional Indian knowledge with modern research, separating tradition from evidence. No invented citations.`,{cache:false});$('#exo').innerHTML='<p class="res">'+esc(r.text)+'</p><span class="tag">AI-generated</span>'}catch(e){$('#exo').innerHTML='<p class="err">'+esc(e.message||'Request failed')+'</p>'}};draw()};
svg.onclick=e=>{const g=e.target.closest('.node');if(g)pick(g.dataset.id)};svg.onkeydown=e=>{if(e.key==='Enter'){const g=e.target.closest('.node');if(g)pick(g.dataset.id)}};
$('#pw').onclick=e=>{const b=e.target.closest('button');if(!b)return;pw=b.dataset.p;document.querySelectorAll('#pw .chip').forEach(c=>c.classList.toggle('on',c===b));draw()};draw()}
/* Library */
function lib(){const d=()=>{const q=$('#ls').value.toLowerCase();const r=LIB.filter(l=>l.join(' ').toLowerCase().includes(q));$('#ll').innerHTML=r.length?r.map(l=>`<div class="card"><span class="tag">${l[1]}</span><h3 style="margin-top:.5rem">${l[0]}</h3><p>${l[3]}</p><a href="#${l[2]}">${DOM[l[2]].n}</a></div>`).join(''):'<p>No matches. Try a broader term like “water” or “text”.</p>'};$('#ls').oninput=d;d()}
/* Assistant */
const MODES={auto:['Auto (recommended)','Infer the best style from the question.'],gen:['General AI','Answer clearly and helpfully.'],iks:['IKS Research Expert','Expert on Indian Knowledge Systems; separate traditional claims from modern evidence; never present traditional treatments as proven cures; never invent citations.'],code:['Coding','Senior engineer: correct, minimal, runnable code in fenced blocks with brief explanation.'],tutor:['Study & Tutor','Teach step by step, check understanding, give a practice question.'],res:['Research','Structured, cautious, note uncertainty, never fabricate references.'],cre:['Creative','Vivid, original writing.']};
function md(t){const parts=t.split(/```(\w*)\n?([\s\S]*?)(?:```|$)/g);let o='';for(let i=0;i<parts.length;i+=3){o+=inl(parts[i]);if(i+2<parts.length)o+=`<pre><button class="cp" data-c>Copy</button><code>${esc(parts[i+2])}</code></pre>`}return o}
function inl(s){let h=esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/^#{1,4} (.+)$/gm,'<h3>$1</h3>').replace(/^[-*] (.+)$/gm,'• $1');return h.replace(/\n/g,'<br>')}
function chat(){let C=[],cur=null,ab=null;try{C=JSON.parse(localStorage.getItem('anv')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('anv',JSON.stringify(C))}catch(e){}};
const mk=()=>{const c={id:Date.now(),t:'New chat',m:[]};C.unshift(c);cur=c;save();hist();show()};
const hist=()=>{const q=$('#hs').value.toLowerCase();$('#hist').innerHTML=C.filter(c=>(c.t+JSON.stringify(c.m)).toLowerCase().includes(q)).map(c=>`<div class="hi${c===cur?' on':''}"><button class="t" data-o="${c.id}">${esc(c.t)}</button><button class="x" data-r="${c.id}" aria-label="Rename">✎</button><button class="x" data-d="${c.id}" aria-label="Delete">✕</button></div>`).join('')||'<small>No chats yet.</small>'};
const show=(live)=>{const m=cur.m;$('#msgs').innerHTML=m.length?m.map(x=>`<div class="m ${x.r}">${x.r==='user'?esc(x.c):md(x.c)}${x.r==='assistant'?'<div><button class="cp" data-m>Copy reply</button></div>':''}</div>`).join(''):'<div class="m assistant">Ask me anything: maths, code, science, careers, writing, or Indian Knowledge Systems. English, हिंदी or Hinglish.</div>';if(!m.length)$('#sg').innerHTML=ST.map(s=>`<button class="chip">${esc(s)}</button>`).join('');$('#msgs').scrollTop=1e9};
async function run(){const m=cur.m,mode=$('#md').value;$('#sd').disabled=true;$('#st').hidden=false;$('#sg').innerHTML='';m.push({r:'assistant',c:''});show();ab=new AbortController();const sys='You are ANVAYA AI, a capable general-purpose assistant (not limited to IKS). Reply in the user\'s language (English, Hindi or Hinglish). '+MODES[mode][1]+' You have no live web access; say so if asked about current events. Use Markdown and fenced code blocks.';
const hh=m.slice(0,-1).slice(-20).map(x=>({role:x.r,content:x.c}));const first=hh.findIndex(x=>x.role==='user');const msgs=hh.slice(first);msgs[0]={role:'user',content:'[Instructions] '+sys+'\n\n[Conversation]\n'+msgs[0].content};
try{const r=await ai(msgs,{cache:false,signal:ab.signal,onText:x=>{m[m.length-1].c=x.text;const e=$('#msgs').lastElementChild;if(e){e.innerHTML=md(x.text)};$('#msgs').scrollTop=1e9}});m[m.length-1].c=r.text;
const f=await ai('Give exactly 3 short follow-up questions a user might ask next, one per line, no numbering, based on: '+r.text.slice(0,700),{cache:false}).catch(()=>null);if(f)$('#sg').innerHTML=f.text.split('\n').filter(Boolean).slice(0,3).map(s=>`<button class="chip">${esc(s)}</button>`).join('')}catch(e){const p=m[m.length-1];if(e.name==='AbortError'||e.code==='aborted'){p.c=(p.c||'')+'\n\n*Stopped.*'}else p.c=(p.c||'')+'\n\n**Error:** '+(e.message||e.code||'request failed')+'. Use Regenerate to retry.'}
save();show();$('#sd').disabled=false;$('#st').hidden=true;hist()}
const send=t=>{t=t.trim();if(!t||$('#sd').disabled)return;if(cur.t==='New chat')cur.t=t.slice(0,40);cur.m.push({r:'user',c:t});$('#in').value='';run()};
$('#nc').onclick=mk;$('#hs').oninput=hist;$('#sd').onclick=()=>send($('#in').value);$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send($('#in').value)}};
$('#st').onclick=()=>ab&&ab.abort();$('#rg').onclick=()=>{if($('#sd').disabled)return;while(cur.m.length&&cur.m[cur.m.length-1].r==='assistant')cur.m.pop();if(cur.m.length)run()};
$('#sg').onclick=e=>{const b=e.target.closest('.chip');if(b)send(b.textContent)};
$('#msgs').onclick=e=>{const b=e.target.closest('.cp');if(!b)return;const t=b.hasAttribute('data-c')?b.nextElementSibling.textContent:cur.m[[...$('#msgs').children].indexOf(b.closest('.m'))].c;navigator.clipboard.writeText(t).then(()=>b.textContent='Copied',()=>b.textContent='Failed')};
$('#hist').onclick=e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset;if(D.o){cur=C.find(c=>c.id==D.o);show();hist()}if(D.d){C=C.filter(c=>c.id!=D.d);if(!C.length)mk();else{cur=cur&&C.includes(cur)?cur:C[0]}save();show();hist()}if(D.r){const c=C.find(c=>c.id==D.r),n=prompt('Rename chat',c.t);if(n&&n.trim()){c.t=n.trim().slice(0,60);save();hist()}}};
if(!C.length)mk();else{cur=C[0];hist();show()}}
/* Router */
function route(){const k=(location.hash||'#home').slice(1);const key=P[k]?k:'home';$('#nav').innerHTML=R.map(r=>`<a href="#${r[0]}"${r[0]===key?' class="on" aria-current="page"':''}>${r[1]}</a>`).join('');$('#app').innerHTML=P[key]();document.title=(key==='home'?'':R.find(r=>r[0]===key)[1]+' · ')+'ANVAYA AI';({engine:graph,studio:studio,assistant:chat,library:lib,quiz:quizPage})[key]?.();if(DOM[key])labInit(key);fillPhotos();if(DOM[key])quiz($('#qz'),QZ.filter(q=>q[4]===key));scrollTo(0,0);const a=$('#nav .on');a&&a.scrollIntoView({inline:'center',block:'nearest'})}
document.addEventListener('click',e=>{if(e.target.id==='ks'){e.preventDefault();const k=prompt('Gemini API key (leave empty to remove the saved key):');if(k!==null){try{k.trim()?localStorage.setItem('anv_key',k.trim()):localStorage.removeItem('anv_key')}catch(x){}}const mm=prompt('Model name (leave empty for default gemini-3.8-flash):');if(mm!==null){try{mm.trim()?localStorage.setItem('anv_model',mm.trim()):localStorage.removeItem('anv_model')}catch(x){}}}});addEventListener('hashchange',route);route();
</script></body></html>
